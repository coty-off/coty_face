services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/uploads
      - ./photos:/photos
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app:/app/project:/app/coty
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker-segment:
    build: .
    command: celery -A api.celery_app worker --loglevel=info -Q segment -c 1
    volumes:
      - ./uploads:/uploads
      - ./photos:/photos
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app:/app/project:/app/coty

  worker-colors:
    build: .
    command: celery -A api.celery_app worker --loglevel=info -Q colors -c 1
    volumes:
      - ./uploads:/uploads
      - ./photos:/photos
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app:/app/project:/app/coty

  flower:
    build: .
    command: celery -A api.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0

volumes:
  photos:
  uploads: