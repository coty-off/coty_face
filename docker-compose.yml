services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: diplom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env 
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/uploads
      - ./photos:/photos
      - ./api:/app/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - EXTERNAL_BODY_API_URL=https://beggarly-emerging-sharksucker.cloudpub.ru
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/diplom_db
      # - SECRET_KEY=super-secret-key-change-in-production-2026
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/app:/app/project:/app/coty
      - YANDEX_CLIENT_ID=59d9f8f51db8489d95aaf01420386ac5
      - YANDEX_CLIENT_SECRET=f6e1a71c684143cabc128c02fe8190e7
      - YANDEX_REDIRECT_URI=https://cotybynutta.cloudpub.ru/auth/yandex/callback
      - FRONTEND_URL=https://cotybynutta.cloudpub.ru
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker-segment:
    build: .
    command: celery -A api.celery_app worker --loglevel=info -Q segment -c 1
    volumes:
      - ./uploads:/uploads
      - ./photos:/photos
      - ./api:/app/api
    depends_on:
      - redis
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/diplom_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/app:/app/project:/app/coty
    restart: unless-stopped

  worker-colors:
    build: .
    command: celery -A api.celery_app worker --loglevel=info -Q colors -c 1
    volumes:
      - ./uploads:/uploads
      - ./photos:/photos
      - ./api:/app/api
    depends_on:
      - redis
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/diplom_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/app:/app/project:/app/coty
    restart: unless-stopped

  flower:
    build: .
    command: celery -A api.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    restart: unless-stopped
  

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./coty-frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  photos: